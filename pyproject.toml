[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minkowski-correlations"
version = "0.1.0"
description = "Minkowski functionals of two-dimensional point patterns"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]